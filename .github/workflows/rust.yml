name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
    # --workspace, not the default. Without it cargo only builds and tests the
    # root `iris` package, so iris-gui was never compiled here at all and its
    # tests never ran — a GUI-only breakage could not turn this red. It needs no
    # extra system packages: wayland, X11 and GL are dlopen'd at runtime, so the
    # only thing it links is libasound, which is already installed above.
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
    # CI audio capture (#73). The resampler and the audio-backend traits have
    # null/wav sinks, but until now nothing in CI drove them: a regression in
    # the capture path would only show up on a developer's machine with the
    # right env var set. This runs the `IRIS_HAL2_CAPTURE` wav backend through
    # the same `select_backend` path `Hal2::start` uses, pushes a short
    # synthetic Codec A stream through the real drain, then asserts the file is
    # a well-formed RIFF/WAVE (PCM, stereo, 48 kHz, 16-bit) with non-zero
    # samples and header sizes matching the payload.
    #
    # It is `--ignored` because it writes `IRIS_HAL2_CAPTURE` into the process
    # environment, which is global and would race the parallel test pool; CI is
    # the one place that runs it, serially. A full headless emulator boot is
    # not used here: with no IRIX media it only ever drains silence, so the
    # capture is driven through the library at the codec drain, where the
    # samples are deterministic.
    - name: HAL2 audio capture (wav backend)
      env:
        IRIS_HAL2_CAPTURE: ${{ runner.temp }}/hal2-capture.wav
      run: cargo test --lib capture_through_the_wav_backend -- --ignored --nocapture --test-threads=1
    # The parallel-agent workflow: boot two isolated instances (`--instance N`)
    # and drive each over its own CI serial socket. No IRIX media needed — the
    # Indy PROM's command monitor is the serial endpoint. Catches regressions
    # in instance derivation, the CI socket/serial path, and per-instance
    # isolation that the unit tests alone would miss.
    - name: Fleet parallel-agent test
      run: test/fleet/run.sh target/debug/iris target/debug/iris-ci
