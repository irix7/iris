name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# Runner images match release.yml: ubuntu-24.04 (glibc floor), macos-26 (pinned
# through GitHub's macos-15 -> macos-26 migration; arm64), windows-latest (x64).
# fail-fast is off so one platform breaking still reports the others.
jobs:
  # Default features, every workspace crate, all three host platforms.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-24.04,   informational: false }
          - { name: macos,   os: macos-26,       informational: true }
          - { name: windows, os: windows-latest, informational: true }
    steps:
    - uses: actions/checkout@v5
    # rust-toolchain.toml pins nightly; `rustup show` installs it up front so a
    # toolchain download doesn't land inside the Build step's timing.
    - name: Install pinned toolchain
      run: rustup show
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-test-cargo-
    # --workspace, not the default. Without it cargo only builds and tests the
    # root `iris` package, so iris-gui was never compiled here at all and its
    # tests never ran — a GUI-only breakage could not turn this red. It needs no
    # extra system packages: wayland, X11 and GL are dlopen'd at runtime, so the
    # only thing it links is libasound, which is already installed above.
    - name: Build
      run: cargo build --workspace --verbose
    # macOS and Windows test results are informational: a failure is reported
    # (red step, annotation on the run) but does not fail the job or the
    # workflow. Shared runners there are slower and noisier, and several tests
    # read the wall clock. Their Build step above still gates; Linux gates on
    # both.
    - name: Run tests
      continue-on-error: ${{ matrix.informational }}
      run: cargo test --workspace --verbose
    # CI audio capture (#73). The resampler and the audio-backend traits have
    # null/wav sinks, but until now nothing in CI drove them: a regression in
    # the capture path would only show up on a developer's machine with the
    # right env var set. This runs the `IRIS_HAL2_CAPTURE` wav backend through
    # the same `select_backend` path `Hal2::start` uses, pushes a short
    # synthetic Codec A stream through the real drain, then asserts the file is
    # a well-formed RIFF/WAVE (PCM, stereo, 48 kHz, 16-bit) with non-zero
    # samples and header sizes matching the payload.
    #
    # It is `--ignored` because it writes `IRIS_HAL2_CAPTURE` into the process
    # environment, which is global and would race the parallel test pool; CI is
    # the one place that runs it, serially. A full headless emulator boot is
    # not used here: with no IRIX media it only ever drains silence, so the
    # capture is driven through the library at the codec drain, where the
    # samples are deterministic.
    - name: HAL2 audio capture (wav backend)
      env:
        IRIS_HAL2_CAPTURE: ${{ runner.temp }}/hal2-capture.wav
      run: cargo test --lib capture_through_the_wav_backend -- --ignored --nocapture --test-threads=1
    # The parallel-agent workflow: boot two isolated instances (`--instance N`)
    # and drive each over its own CI serial socket. No IRIX media needed — the
    # Indy PROM's command monitor is the serial endpoint. Catches regressions
    # in instance derivation, the CI socket/serial path, and per-instance
    # isolation that the unit tests alone would miss.
    - name: Fleet parallel-agent test
      run: test/fleet/run.sh target/debug/iris target/debug/iris-ci
    # Record/replay journal (#47): boot one headless instance to the PROM command
    # monitor, snapshot it, record a guest-cycle journal from the snapshot and
    # replay it. `iris-ci journal-replay` exits non-zero unless the replay's event
    # stream is byte-identical to the recording, so this is the CI assertion that
    # a replay equals a recording. It does not need IRIX media; a full threaded
    # IRIX boot remains unverified (see test/journal/run.sh).
    - name: Journal record/replay test
      run: test/journal/run.sh target/debug/iris target/debug/iris-ci

  # The nightly/release CLI feature set (scripts/dist/lib.sh): a build check
  # only, so a platform-specific break in the Cranelift JITs or the lightning
  # interpreter path turns CI red before a nightly does.
  features:
    name: Build release features (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-24.04 }
          - { name: macos,   os: macos-26 }
          - { name: windows, os: windows-latest }
    steps:
    - uses: actions/checkout@v5
    - name: Install pinned toolchain
      run: rustup show
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libgl-dev  # hostgl links libGL
    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-features-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-features-cargo-
    - name: Build
      run: cargo build --release -p iris --bins --features lightning,jitv2,gpujit,idle-pause,hostgl

  # The distribution scripts run only in nightly and release builds, so lint
  # them here where a mistake shows up on the pull request.
  dist-scripts:
    name: Lint scripts/dist
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - run: shellcheck -x -S warning scripts/dist/*.sh scripts/build-macos.sh
    - name: Version strings
      run: |
        [ "$(scripts/dist/version.sh release v1.2.3)" = 1.2.3 ]
        [ "$(scripts/dist/version.sh nightly 2026-01-05)" = nightly.2026.01.05 ]
        ! scripts/dist/version.sh release v1.2 2>/dev/null
    - name: Release notes render
      run: scripts/dist/release-notes.sh --channel nightly --version nightly.2026.01.05 --tag nightly
