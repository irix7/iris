# The bare-metal suites — cpu-tests/ and bench/.
#
# One workflow because they are the same machine: both build a guest binary
# with the MIPS cross toolchain, then run it against IRIS built for each CPU x
# engine cell. Kept as two workflows, that meant installing the toolchain twice
# and — far more expensively — building *eight* emulators per push instead of
# four, since any change to src/cpu/mips_*.rs triggers both. The release profile is
# fat-LTO with codegen-units=1, so an emulator build is the dominant cost in
# this repo's CI and halving the count is the whole point of merging.
#
# The two suites answer different questions and neither replaces the other:
#
#   cpu-tests  is this instruction correct — one at a time, clean state.
#              R4400 vs R5000 because the mips4/ group requires each MIPS IV
#              instruction to compute on R5000 and raise Reserved Instruction
#              on R4400. interp vs jitv2 because a guest-visible ISA suite is
#              the cleanest JIT differential available.
#
#   bench      is it still correct after ten million of them, with whatever
#              state the last million left — and how long did that take.
#
# CI gates bench on its ACCURACY score, never on its performance numbers: a
# shared runner's throughput varies by more than most real regressions, so a
# perf threshold would either catch nothing or fire every other week. The
# figures are still collected and uploaded so a run can be read after the fact.
#
# Both suites run in every cell even when the first one fails. cpu-tests exits
# with its failure count and has known findings (cpu-tests/docs/findings.md),
# so letting it abort the job would hide the benchmark's accuracy result behind
# an unrelated red. If you want this workflow to be green-when-healthy rather
# than red-until-every-finding-is-fixed, gate cpu-tests on "no worse than a
# recorded baseline" instead of on zero — that still catches regressions, which
# a permanently-red gate does not.

name: Bare-metal suites

on:
  push:
    branches: [ "main" ]
    paths: &suite_paths
      - 'cpu-tests/**'
      - 'bench/**'
      - 'src/cpu/mips_*.rs'
      - 'src/cpu/jitv2/**'
      - 'src/elf.rs'
      - 'src/dev/testdev.rs'
      - 'src/bench_report.rs'
      - 'src/bench_runner.rs'
      - 'src/benchsuite.rs'
      - 'src/bin/iris_bench.rs'
      - '.github/workflows/suites.yml'
  pull_request:
    branches: [ "main" ]
    paths: *suite_paths
  workflow_dispatch:

# The report job records results back to data/ and regenerates the README
# graphs, so it needs to push. `[skip ci]` on that commit prevents a loop:
# data/ and README.md are outside this workflow's push paths, but not rust.yml's.
#
# GOTCHA: GitHub also honours the "skip-ci" directive when it appears in a
# *commit message* (subject or body, even inside backticks/quotes as prose).
# Do not write the literal "[skip ci]" / "[ci skip]" / "[no ci]" / "skip-checks"
# in a commit message unless you mean to skip that commit's workflows.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  guests:
    name: Build the guest binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the MIPS cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu binutils-mips-linux-gnu

      # Three checked-in generated files, all verified the same way: regenerate
      # and fail on a diff. That is what stops a generator and its output from
      # drifting apart, and it is why building either suite needs nothing but
      # the cross toolchain.

      # `make vectors` also runs the generator's --check pass, which cross-checks
      # its exact rational arithmetic against the runner's own FPU before
      # writing anything.
      - name: cpu-tests — FP vectors up to date
        run: |
          make -C cpu-tests vectors
          git diff --exit-code cpu-tests/tests/fpu/fpvectors.c \
                               cpu-tests/tests/fpu/fpvectors.h

      # Doubles as a determinism check on the suite itself: a kernel whose
      # result depends on uninitialised memory or on the host's byte order
      # produces a different table on a different runner. Every one of those has
      # already happened once — rules/testing/benchmark-suite-gotchas.md.
      - name: bench — golden checksums up to date
        run: |
          make -C bench golden
          git diff --exit-code bench/golden/golden.h

      - name: Build the guest binaries
        run: |
          make -C cpu-tests
          make -C bench

      # bench/prebuilt/irisbench.elf is linked into `iris` with include_bytes!
      # so the benchmark runs on a machine with no cross toolchain — a released
      # app, a sandboxed one, or anyone who just wants the number. A checked-in
      # build product that can drift is worse than no build product, and this
      # one drifts dangerously: accuracy is scored against golden checksums
      # compiled *into* the image, so a stale image against fresh goldens
      # reports failures to users that are not real.
      #
      # Compares a digest of the *sources* rather than the image bytes. Byte
      # comparison against a fresh build does not work and this job proved it:
      # the guest is compiled with -g, so DWARF records the build directory, and
      # a runner's path is never a developer's. Two correct builds of identical
      # source differ. See bench/prebuilt-stamp.py.
      #
      # On a pull request this is a gate: run `make -C bench prebuilt` and commit
      # bench/prebuilt/ with the change that caused it. On main the report job
      # rebuilds and commits it automatically, so a missed refresh cannot leave
      # main red or ship a stale image (a stale one is worse than none — accuracy
      # is scored against golden checksums compiled into the image).
      - name: bench — checked-in guest binary matches its sources
        if: github.event_name == 'pull_request'
        run: make -C bench check-prebuilt

      # One binary of each for every cell below — that is what makes the matrix
      # a differential test rather than N independent runs.
      - uses: actions/upload-artifact@v7
        with:
          name: guest-elfs
          path: |
            cpu-tests/build/cputest.elf
            bench/build/irisbench.elf
          if-no-files-found: error

  host-baseline:
    name: Host baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The same kernels, natively. Its accuracy score must be 100% by
      # construction — it is the source of the golden values — so a failure
      # here means a kernel is not deterministic even against itself.
      - name: Build and run
        run: |
          make -C bench hostbench
          ./bench/build/irisbench-host | tee bench/build/host.log
      - name: The oracle must agree with itself
        run: grep -q 'IRIS-BENCH-DONE rc=0' bench/build/host.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-host-log
          path: bench/build/host.log
          if-no-files-found: ignore

  run:
    name: ${{ matrix.cpu }} / ${{ matrix.engine }}
    needs: guests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cpu: [r4400, r5000]
        engine: [interp, jitv2]
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: actions/download-artifact@v8
        with:
          name: guest-elfs
          path: .

      - uses: Swatinem/rust-cache@v2

      # The JIT is a compile-time cargo feature; the CPU is not — the run
      # steps below pass `--cpu`. The R5000 cell is the R5000 without a
      # secondary cache: r5ksc / r5ksc_triton are refused at compile time
      # (src/lib.rs, rules/testing/r5k-l1i-cache-bugs.md), and CPU/FPU
      # correctness (what cpu-tests exercises) doesn't depend on it.
      #
      # jitv2 is the only MIPS JIT (the v1 tiered compiler was removed in
      # 33c4e68). It needs no runtime switch — it is active as soon as the
      # feature is compiled in.
      #
      # iris-bench is built with the cell's features too. It embeds the guest
      # image and can run the suite in-process, so a default-feature build here
      # would quietly be a different machine from the one this cell is named
      # after.
      - name: Build IRIS
        run: |
          FEATURES=""
          [ "${{ matrix.engine }}" = "jitv2" ] && FEATURES="jitv2"
          if [ -n "$FEATURES" ]; then
            cargo build --release --bin iris --bin iris-bench --features "$FEATURES"
          else
            cargo build --release --bin iris --bin iris-bench
          fi

      # ── cpu-tests ────────────────────────────────────────────────────────
      #
      # Records its result rather than exiting on it, so the benchmark below
      # still runs and reports. The gate at the end of the job is what turns a
      # nonzero count red. A timeout or a truncated run is different — that is
      # the harness being broken rather than the emulator being wrong — and
      # fails here and now.
      - name: cpu-tests
        run: |
          cd cpu-tests
          chmod +x build/cputest.elf
          timeout 900 ../target/release/iris \
            --config run/bare.toml \
            --cpu ${{ matrix.cpu }} \
            --load-elf build/cputest.elf \
            --test-device --test-device-dump build/dump.json \
            --headless --noaudio 2>&1 | tee build/run.log
          rc=${PIPESTATUS[0]}
          echo "CPUTEST_RC=$rc" >> "$GITHUB_ENV"
          # The exit code saturates at 100 (testlib.c), so it stopped being a
          # usable count the moment a cell exceeded that. Take the real number
          # off the RESULT line, which is what the gate below compares.
          failed=$(grep -oE '^ RESULT: [0-9]+ checks passed, [0-9]+ failed' build/run.log \
                   | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+')
          echo "CPUTEST_FAILED=${failed:-}" >> "$GITHUB_ENV"
          if [ "$rc" = "124" ]; then echo "::error::cpu-tests timed out"; exit 1; fi
          grep -q 'IRIS-CPUTEST-DONE' build/run.log \
            || { echo "::error::cpu-tests never printed its DONE token"; exit 1; }
          # A build whose cargo features did not take would run the wrong CPU
          # and invert every mips4 expectation with no other indication. The
          # guest's banner is authoritative: it reads the CPU out of PRId.
          want=$(echo '${{ matrix.cpu }}' | tr '[:lower:]' '[:upper:]')
          got=$(grep -o 'cpu=[A-Za-z0-9]*' build/run.log | head -1)
          [ "$got" = "cpu=$want" ] \
            || { echo "::error::cpu-tests ran $got, expected cpu=$want"; exit 1; }
          grep -E '^ RESULT:' build/run.log

      # Per-cell host baseline: the same kernels, natively, on THIS runner.
      # The report divides each emulated cell by its own `<cell>-host` run, so
      # the host-normalised efficiency is comparable across the four runners
      # (each cell runs as its own job, on its own machine).
      - name: Host baseline (this runner)
        run: |
          make -C bench hostbench
          ./target/release/iris-bench host --label "${{ matrix.cpu }}-${{ matrix.engine }}-host"

      # ── bench ────────────────────────────────────────────────────────────
      #
      # --iris is required, not decorative: without it `run` measures this
      # process in-process, which is a different thing from the binary this cell
      # built. --elf then defaults to the shared artifact, which is what holds
      # the guest side constant across cells.
      - name: bench
        run: |
          chmod +x bench/build/irisbench.elf
          ./target/release/iris-bench run \
            --iris ./target/release/iris \
            --label "${{ matrix.cpu }}-${{ matrix.engine }}" \
            --timeout 2400 \
            --repeat "${BENCH_REPEAT:-10}" \
            -- --cpu ${{ matrix.cpu }} \
            2>&1 | tee bench/build/run.log

      # Three ways this can fail quietly, so all three are checked. A build
      # whose features did not take runs the wrong CPU and every result is
      # mislabelled; the guest's banner is authoritative because it reads PRId.
      # A kernel that faults is stepped over by the exception dispatcher and
      # still reports a throughput. And a mismatch is the actual regression.
      - name: Check the benchmark run
        run: |
          python3 - <<'PY'
          import json, sys, os
          cell = "${{ matrix.cpu }}-${{ matrix.engine }}"
          # The host-baseline step writes "<cell>-host.json" into this same
          # directory, so an unsorted glob can hand back the host run and fail
          # with "guest reports host". Pick the guest result for this cell.
          path = f"bench/build/results/{cell}.json"
          if not os.path.exists(path):
              sys.exit(f"::error::no guest result file at {path}")
          run = json.load(open(path))
          want = "${{ matrix.cpu }}".upper()
          if run["machine"]["cpu"] != want:
              sys.exit(f"::error::guest reports {run['machine']['cpu']}, expected {want}")
          if not run["machine"]["timebase"]:
              sys.exit("::error::no host time base — every timing is a guess")

          expect_exc = {"sys/exception", "sys/tlb_miss"}
          bad = [r for r in run["rows"] if r["status"] == "MISMATCH"]
          exc = [r for r in run["rows"] if r["exc"] and r["name"] not in expect_exc]
          for r in bad:
              print(f"::error::{r['name']} checksum {r['checksum']} != {r['golden']}")
          for r in exc:
              print(f"::error::{r['name']} took {r['exc']} unexpected exceptions")

          mips = run["total_icount"] * 1e3 / max(run["total_ns"], 1)
          print(f"{run['cell']}: {run['matched']}/{run['checked']} matched, "
                f"{mips:.1f} guest MIPS, {run['total_ns']/1e9:.1f} s timed")
          sys.exit(1 if bad or exc else 0)
          PY

      # The path a released application actually takes: no subprocess, no ELF on
      # disk, the guest image read straight out of the binary. Quick mode, and
      # only on the default cell — the embedded runner is the same code in every
      # cell, and what it exercises is the plumbing, not the CPU model.
      - name: The embedded runner must work too
        if: matrix.cpu == 'r4400' && matrix.engine == 'interp'
        run: cargo test --release --lib bench_runner -- --ignored --nocapture

      # One place both results are visible, and the only thing that turns a
      # cpu-tests failure count red.
      #
      # The gate is a *baseline*, not zero. cpu-tests has never returned 0:
      # 29f5602 grew the fpu group to 88 tests and landed 121 known failures
      # with it, each one a deliberate finding written up in
      # cpu-tests/docs/findings.md §6-§10 (no Unimplemented Operation, inert
      # FCSR.FS, a trapped exception still writes its result, FCSR.Cause
      # accumulates). Those are spec gaps in IRIS's FPU exception model, not
      # regressions, and the count is the record of them. A later `rc == 0`
      # gate was therefore unsatisfiable from the day it was written.
      #
      # So: more failures than the baseline is a regression and fails. Fewer
      # means a gap was closed — that passes, and asks for the baseline to come
      # down, which is what keeps this number honest instead of drifting up.
      # Lower it in the same commit that closes the gap.
      #
      # CPUTEST_BASELINE was uniform at 61 until the suite was validated against
      # two real Indys (cpu-tests/oracle/). Sixteen expectations turned out to be
      # wrong in a way IRIS happened to share, so correcting them raised what the
      # emulator fails — not a regression, a stricter oracle. The baseline is
      # per cell:
      #
      #            interp  jitv2
      #   r4400     126     126
      #   r5000     110     110
      #
      # Interpreter numbers measured 2026-09-12; +2 since 2026-10-08, when the
      # observation-only cache shadow became the default for R4400/R5000 (#34).
      # Hardware passes 240/240 on both parts, so every one of these is an
      # emulator bug with a confirmed counter-example — see
      # cpu-tests/docs/findings.md. The shadow — like jitv2's implied tcache —
      # has no write-back, so cache/hit_inv_discards fails its 2 checks in every
      # cell by design — see rules/testing/tcache-discards-dirty-data-semantics.md.
      # Otherwise the engines match check-for-check.
      #
      # The opt-in `accurate-cache` build keeps the functional model and so
      # passes that test; it runs in its own job below with its own baseline —
      # the same 126/110 less those 2 checks, i.e. 124/108.
      #
      # Gate on CPUTEST_FAILED, not CPUTEST_RC: the exit code saturates at 100
      # and both cells are past it.
      - name: Result
        if: always()
        env:
          CPUTEST_BASELINE: ${{ matrix.cpu == 'r4400' && 126 || 110 }}
        run: |
          {
            echo "### ${{ matrix.cpu }} / ${{ matrix.engine }}"
            echo '```'
            grep -E '^ RESULT:' cpu-tests/build/run.log 2>/dev/null || echo " cpu-tests: no result"
            grep -E 'accuracy|emulator speed' bench/build/run.log 2>/dev/null | tail -2 \
              || echo " bench: no result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Unset means the cpu-tests step never recorded a result — the run
          # died before the gate could learn anything. That is a failure, and
          # deliberately not the same message as "too many checks failed".
          if [ -z "${CPUTEST_FAILED:-}" ]; then
            echo "::error::cpu-tests recorded no result"
            exit 1
          fi
          if [ "$CPUTEST_FAILED" -gt "$CPUTEST_BASELINE" ]; then
            echo "::error::cpu-tests reported $CPUTEST_FAILED failing checks, baseline is $CPUTEST_BASELINE — $(( CPUTEST_FAILED - CPUTEST_BASELINE )) new"
            exit 1
          fi
          if [ "$CPUTEST_FAILED" -lt "$CPUTEST_BASELINE" ]; then
            echo "::notice::cpu-tests improved to $CPUTEST_FAILED failing checks (baseline $CPUTEST_BASELINE) — lower CPUTEST_BASELINE in .github/workflows/suites.yml"
            echo "cpu-tests improved to $CPUTEST_FAILED (baseline $CPUTEST_BASELINE) — lower the baseline" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suites-${{ matrix.cpu }}-${{ matrix.engine }}
          path: |
            cpu-tests/build/run.log
            cpu-tests/build/dump.json
            bench/build/run.log
            bench/build/results/*.json
          if-no-files-found: ignore

  # The opt-in `accurate-cache` build (#35): the R4400/R5000 run the functional
  # `mips_cache_v2` model and raise VCE, where every default cell runs the
  # observation-only shadow. Only the cache group can tell the two models
  # apart, so this is its own job over cpu-tests alone rather than a fifth
  # `run` axis — a matrix axis would drag a bench run and a per-runner host
  # baseline along with each accurate cell, and bench measures the shipping
  # configuration, not a deliberately non-default cache.
  #
  # It is the same guest binary as every other cell; what changes is the
  # emulator's cache. The one guest-visible difference is the test this cell
  # exists to prove: cache/hit_inv_discards needs private dirty lines, which
  # the shadow (and jitv2's tcache) do not keep, so it fails its 2 checks in
  # every default cell — rules/testing/tcache-discards-dirty-data-semantics.md.
  # The functional model keeps them and must pass.
  accurate-cache:
    name: accurate-cache / ${{ matrix.cpu }}
    needs: guests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cpu: [r4400, r5000]
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: actions/download-artifact@v8
        with:
          name: guest-elfs
          path: .

      - uses: Swatinem/rust-cache@v2

      # The feature is the whole point of the cell, and cargo would happily
      # build the default shadow machine if the flag were dropped. The guest
      # banner below proves the run used the CPU it was asked for; the
      # selected_cache_model unit test proves the flag selects the functional
      # model (src/machine.rs).
      - name: Build IRIS (accurate-cache)
        run: cargo build --release --bin iris --features accurate-cache

      # Same run, accounting and banner check as the `run` job's cpu-tests
      # step. Records the count rather than exiting on it so the baseline gate
      # below gives the one meaningful message; a timeout or a missing DONE
      # token is the harness breaking, not the emulator, and fails here.
      - name: cpu-tests (accurate-cache)
        run: |
          cd cpu-tests
          chmod +x build/cputest.elf
          timeout 900 ../target/release/iris \
            --config run/bare.toml \
            --cpu ${{ matrix.cpu }} \
            --load-elf build/cputest.elf \
            --test-device --test-device-dump build/dump.json \
            --headless --noaudio 2>&1 | tee build/run.log
          rc=${PIPESTATUS[0]}
          echo "CPUTEST_RC=$rc" >> "$GITHUB_ENV"
          failed=$(grep -oE '^ RESULT: [0-9]+ checks passed, [0-9]+ failed' build/run.log \
                   | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+')
          echo "CPUTEST_FAILED=${failed:-}" >> "$GITHUB_ENV"
          if [ "$rc" = "124" ]; then echo "::error::cpu-tests timed out"; exit 1; fi
          grep -q 'IRIS-CPUTEST-DONE' build/run.log \
            || { echo "::error::cpu-tests never printed its DONE token"; exit 1; }
          want=$(echo '${{ matrix.cpu }}' | tr '[:lower:]' '[:upper:]')
          got=$(grep -o 'cpu=[A-Za-z0-9]*' build/run.log | head -1)
          [ "$got" = "cpu=$want" ] \
            || { echo "::error::cpu-tests ran $got, expected cpu=$want"; exit 1; }
          grep -E '^ RESULT:' build/run.log

      # The acceptance criterion, asserted by name so a regression is not just
      # a bare +2 in the count. The harness prints PASS on the test's padded
      # name line only when every check passed.
      - name: cache/hit_inv_discards passes under accurate-cache
        run: |
          grep -qE 'cache/hit_inv_discards.*PASS' cpu-tests/build/run.log \
            || { echo "::error::cache/hit_inv_discards did not PASS under accurate-cache:"; \
                 grep 'cache/hit_inv_discards' cpu-tests/build/run.log || true; exit 1; }

      # The accurate-cache baseline is the default cells' 126/110 less the 2
      # hit_inv_discards checks: this is exactly the functional model the
      # interpreter ran before #34 made the shadow the default, when suites.yml
      # carried 124/108 for the interpreter. Same gate as the default cells —
      # more is a regression, fewer means a gap closed and asks for this number
      # to come down.
      #
      #            accurate-cache
      #   r4400          124
      #   r5000          108
      - name: Result
        if: always()
        env:
          CPUTEST_BASELINE: ${{ matrix.cpu == 'r4400' && 124 || 108 }}
        run: |
          {
            echo "### accurate-cache / ${{ matrix.cpu }}"
            echo '```'
            grep -E '^ RESULT:' cpu-tests/build/run.log 2>/dev/null || echo " cpu-tests: no result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${CPUTEST_FAILED:-}" ]; then
            echo "::error::cpu-tests (accurate-cache) recorded no result"
            exit 1
          fi
          if [ "$CPUTEST_FAILED" -gt "$CPUTEST_BASELINE" ]; then
            echo "::error::cpu-tests (accurate-cache) reported $CPUTEST_FAILED failing checks, baseline is $CPUTEST_BASELINE — $(( CPUTEST_FAILED - CPUTEST_BASELINE )) new"
            exit 1
          fi
          if [ "$CPUTEST_FAILED" -lt "$CPUTEST_BASELINE" ]; then
            echo "::notice::cpu-tests (accurate-cache) improved to $CPUTEST_FAILED failing checks (baseline $CPUTEST_BASELINE) — lower CPUTEST_BASELINE in .github/workflows/suites.yml"
            echo "cpu-tests improved to $CPUTEST_FAILED (baseline $CPUTEST_BASELINE) — lower the baseline" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suites-accurate-cache-${{ matrix.cpu }}
          path: |
            cpu-tests/build/run.log
            cpu-tests/build/dump.json
          if-no-files-found: ignore

  report:
    name: Comparison report
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      - uses: actions/download-artifact@v8
        with:
          pattern: suites-*
          path: artifacts
          merge-multiple: true
      - name: Assemble
        run: |
          mkdir -p bench/build/results
          # Path-qualified, not just *.json: the per-cell artifact now also
          # carries cpu-tests' testdev machine-state dump, and `iris-bench
          # report` parses everything in this directory as a saved Run.
          find artifacts -path '*/bench/build/results/*' -name '*.json' \
               -exec cp {} bench/build/results/ \; || true
          if [ -z "$(ls -A bench/build/results 2>/dev/null)" ]; then
            echo "no results to report"; exit 0
          fi
          cargo build --release --bin iris-bench
          ./target/release/iris-bench report --format md > bench/build/report.md
          cat bench/build/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench/build/report.md
          if-no-files-found: ignore

      # Heal a stale prebuilt guest image on main: if the checked-in image no
      # longer matches the sources it was built from, rebuild and stamp it here
      # and let the commit below carry it. The PR gate in the guests job still
      # catches a stale image at review; this keeps main — and the released
      # binaries that link the image in — current without a human remembering.
      - name: Refresh the prebuilt guest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if make -C bench check-prebuilt; then
            echo "prebuilt guest image is current"
            exit 0
          fi
          echo "::warning::bench/prebuilt is stale on main — rebuilding and committing"
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu binutils-mips-linux-gnu
          make -C bench prebuilt

      # Record this run into data/bench_history.json and regenerate the README
      # benchmark section + SVG. Only on main pushes — PR runs must not write
      # history. The commit is `[skip ci]` so the resulting data/README commit
      # doesn't re-trigger rust.yml.
      - name: Record and regenerate benchmark history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_TITLE: ${{ github.event.head_commit.message }}
        run: |
          if [ ! -f bench/build/report.md ]; then echo "no report to record"; exit 0; fi
          python3 tools/bench_history.py collect \
            --report bench/build/report.md \
            --source "irix7/iris" \
            --commit "${{ github.sha }}" \
            --ref "${{ github.ref_name }}" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --title "$RUN_TITLE"
          python3 tools/bench_graphs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bench_history.json data/bench_cells.svg data/bench_history.svg data/bench_history_eff.svg data/bench_history.md README.md bench/prebuilt/
          if git diff --cached --quiet; then echo "no changes to record"; exit 0; fi
          git commit -m "bench: record CI results and regenerate graphs [skip ci]"
          git push
