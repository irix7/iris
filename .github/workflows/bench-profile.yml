# Rust-level profiling of the emulator (flamegraphs via perf).
# Runs on every push to main, and on workflow_dispatch for ad-hoc commits.
# Uploads interactive SVG flamegraphs as artifacts.
name: Benchmark Profile

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to profile (commit SHA, tag, branch)"
        required: false
        default: ""
      cpu:
        description: "Emulated CPU (r4400 or r5000)"
        required: true
        default: "r4400"
      engine:
        description: "interp or jitv2"
        required: true
        default: "jitv2"
      quick:
        description: "Run quick suite (30% time)"
        type: boolean
        required: false
        default: true
      profile_irix:
        description: "Also run the IRIX boot profile and benchmark (needs IRIS_IRIX_IMAGE_URL)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read  # for downloading artifacts if needed

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-g"  # debug info for perf

jobs:
  profile:
    name: Profile ${{ matrix.cpu }}-${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: r4400
            engine: interp
          - cpu: r4400
            engine: jitv2
          - cpu: r5000
            engine: interp
          - cpu: r5000
            engine: jitv2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Short SHA
        id: short
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Install profiling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev linux-tools-common linux-tools-generic
          # perf needs kernel headers matching the runner kernel
          sudo apt-get install -y "linux-headers-$(uname -r)" 2>/dev/null || true
          # Hosted runners restrict perf by default; profile-only job.
          sudo sysctl -w kernel.perf_event_paranoid=1

      - uses: Swatinem/rust-cache@v2

      - name: Build emulator with debug info
        run: |
          FEATURES=()
          if [ "${{ matrix.engine }}" = "jitv2" ]; then FEATURES=(--features jitv2); fi
          cargo build --release --bin iris "${FEATURES[@]}"
          cargo build --release --bin iris-bench "${FEATURES[@]}"

      - name: Build host baseline (native)
        run: make -C bench hostbench

      - name: Run benchmark under perf
        env:
          INPUT_QUICK: ${{ inputs.quick }}
        run: |
          set -o pipefail
          OUT_DIR="profile-${{ matrix.cpu }}-${{ matrix.engine }}-${{ steps.short.outputs.sha }}"
          mkdir -p "$OUT_DIR"

          QUICK_FLAG="--quick"
          if [ "$INPUT_QUICK" = "false" ]; then QUICK_FLAG=""; fi

          # Run with perf record -g (call graphs) at 99Hz (lower overhead than default)
          # Use --call-graph dwarf for better Rust symbol resolution
          perf record -g --call-graph dwarf -F 99 -o "$OUT_DIR/perf.data" \
            ./target/release/iris-bench run \
              --cpu ${{ matrix.cpu }} \
              --label ${{ matrix.cpu }}-${{ matrix.engine }} \
              --repeat 3 \
              --out "$OUT_DIR" \
              $QUICK_FLAG \
              2>&1 | tee "$OUT_DIR/run.log"

          # Also capture raw MIPS output for correlation
          grep -E "(MIPS|guest MIPS|emulator speed)" "$OUT_DIR/run.log" > "$OUT_DIR/summary.txt" || true

      - name: Generate flamegraph
        run: |
          OUT_DIR="profile-${{ matrix.cpu }}-${{ matrix.engine }}-${{ steps.short.outputs.sha }}"
          cargo install inferno --locked 2>/dev/null || true
          export PATH="$HOME/.cargo/bin:$PATH"

          perf script -i "$OUT_DIR/perf.data" | inferno-collapse-perf > "$OUT_DIR/collapsed.txt"
          inferno-flamegraph "$OUT_DIR/collapsed.txt" > "$OUT_DIR/flamegraph.svg"
          cp "$OUT_DIR/collapsed.txt" "$OUT_DIR/folded.txt"

      - name: Upload profile artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-${{ matrix.cpu }}-${{ matrix.engine }}-${{ steps.short.outputs.sha }}
          path: |
            profile-${{ matrix.cpu }}-${{ matrix.engine }}-${{ steps.short.outputs.sha }}/flamegraph.svg
            profile-${{ matrix.cpu }}-${{ matrix.engine }}-${{ steps.short.outputs.sha }}/folded.txt
            profile-${{ matrix.cpu }}-${{ matrix.engine }}-${{ steps.short.outputs.sha }}/summary.txt
            profile-${{ matrix.cpu }}-${{ matrix.engine }}-${{ steps.short.outputs.sha }}/run.log
          retention-days: 30

      - name: Upload perf.data (for local analysis)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perfdata-${{ matrix.cpu }}-${{ matrix.engine }}-${{ steps.short.outputs.sha }}
          path: profile-${{ matrix.cpu }}-${{ matrix.engine }}-${{ steps.short.outputs.sha }}/perf.data
          retention-days: 7

  # Optional: profile an IRIX boot. Needs the IRIS_IRIX_IMAGE_URL secret and
  # the profile_irix workflow_dispatch input; job-level `if` cannot read secrets.
  profile-irix:
    name: Profile IRIX Boot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: ${{ inputs.profile_irix }}
    needs: profile
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Short SHA
        id: short
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev linux-tools-common linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=1

      - uses: Swatinem/rust-cache@v2

      - name: Build emulator (jitv2)
        run: cargo build --release --bin iris --features jitv2

      - name: Download IRIX disk image
        env:
          IRIS_IRIX_IMAGE_URL: ${{ secrets.IRIS_IRIX_IMAGE_URL }}
        run: |
          set -e
          : "${IRIS_IRIX_IMAGE_URL:?set the IRIS_IRIX_IMAGE_URL secret}"
          echo "Downloading IRIX image..."
          wget -q --show-progress -O irix-disk.chd "$IRIS_IRIX_IMAGE_URL"
          ls -lh irix-disk.chd

      - name: Profile IRIX boot under perf
        run: |
          set -e
          OUT_DIR="profile-irix-boot-${{ steps.short.outputs.sha }}"
          mkdir -p "$OUT_DIR"
          SOCKET="$OUT_DIR/iris.sock"

          perf record -g --call-graph dwarf -F 99 -o "$OUT_DIR/perf.data" \
            ./target/release/iris \
              --cpu r4400 \
              --scsi1 irix-disk.chd \
              --ci \
              --ci-socket "$SOCKET" \
              --serial-log "$OUT_DIR/boot.log" \
              > "$OUT_DIR/emu.stdout" 2>&1 &
          EMU_PID=$!

          for _ in $(seq 1 60); do
            [ -S "$SOCKET" ] && break
            sleep 2
          done
          [ -S "$SOCKET" ] || { echo "CI socket never appeared" >&2; exit 1; }

          ./target/release/iris-ci --socket "$SOCKET" boot --timeout 600
          grep -q "login:" "$OUT_DIR/boot.log" && echo "Reached login prompt"
          ./target/release/iris-ci --socket "$SOCKET" quit || true
          wait "$EMU_PID" || true

      - name: Generate IRIX boot flamegraph
        run: |
          OUT_DIR="profile-irix-boot-${{ steps.short.outputs.sha }}"
          cargo install inferno --locked 2>/dev/null || true
          export PATH="$HOME/.cargo/bin:$PATH"
          perf script -i "$OUT_DIR/perf.data" | inferno-collapse-perf > "$OUT_DIR/collapsed.txt"
          inferno-flamegraph "$OUT_DIR/collapsed.txt" > "$OUT_DIR/flamegraph.svg"

      - name: Upload IRIX boot profile
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-irix-boot-${{ steps.short.outputs.sha }}
          path: |
            profile-irix-boot-${{ steps.short.outputs.sha }}/flamegraph.svg
            profile-irix-boot-${{ steps.short.outputs.sha }}/collapsed.txt
            profile-irix-boot-${{ steps.short.outputs.sha }}/boot.log
            profile-irix-boot-${{ steps.short.outputs.sha }}/emu.stdout
          retention-days: 30

  # Run the IRIX benchmark suite after boot. Needs the same secret and input
  # as profile-irix, but no perf: instrumenting the host would distort the
  # guest timings this job exists to measure.
  bench-irix:
    name: IRIX Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: ${{ inputs.profile_irix }}
    needs: profile
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Short SHA
        id: short
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build emulator (jitv2) + iris-bench + iris-ci
        run: |
          cargo build --release --bin iris --features jitv2
          cargo build --release --bin iris-bench --features jitv2
          cargo build --release --bin iris-ci --features jitv2

      - name: Download IRIX disk image
        env:
          IRIS_IRIX_IMAGE_URL: ${{ secrets.IRIS_IRIX_IMAGE_URL }}
        run: |
          set -e
          : "${IRIS_IRIX_IMAGE_URL:?set the IRIS_IRIX_IMAGE_URL secret}"
          echo "Downloading IRIX image..."
          wget -q --show-progress -O irix-disk.chd "$IRIS_IRIX_IMAGE_URL"
          ls -lh irix-disk.chd

      - name: Start IRIX and wait for a shell
        run: |
          set -e
          OUT_DIR="irix-bench-${{ steps.short.outputs.sha }}"
          mkdir -p "$OUT_DIR"
          SOCKET="$OUT_DIR/iris.sock"

          ./target/release/iris \
            --cpu r4400 \
            --scsi1 irix-disk.chd \
            --ci \
            --ci-socket "$SOCKET" \
            --serial-log "$OUT_DIR/emu.log" \
            > "$OUT_DIR/emu.stdout" 2>&1 &
          EMU_PID=$!
          echo "$EMU_PID" > "$OUT_DIR/emu.pid"

          for _ in $(seq 1 60); do
            [ -S "$SOCKET" ] && break
            sleep 2
          done
          [ -S "$SOCKET" ] || { echo "CI socket never appeared" >&2; exit 1; }

          ./target/release/iris-ci --socket "$SOCKET" boot --timeout 600
          ./target/release/iris-ci --socket "$SOCKET" login
          # The guest runs its own X server; the host needs no display.
          ./target/release/iris-ci --socket "$SOCKET" run "startx >/tmp/startx.log 2>&1 &"
          for _ in $(seq 1 30); do
            if ./target/release/iris-ci --socket "$SOCKET" run "test -S /tmp/.X11-unix/X0" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Run IRIX benchmark suite
        run: |
          set -o pipefail
          OUT_DIR="irix-bench-${{ steps.short.outputs.sha }}"
          SOCKET="$OUT_DIR/iris.sock"

          make -C bench hostbench
          ./target/release/iris-bench irix \
            --socket "$SOCKET" \
            --out "$OUT_DIR" \
            2>&1 | tee "$OUT_DIR/irix-bench.log"

      - name: Upload IRIX bench results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irix-bench-${{ steps.short.outputs.sha }}
          path: |
            irix-bench-${{ steps.short.outputs.sha }}/*.json
            irix-bench-${{ steps.short.outputs.sha }}/irix-bench.log
            irix-bench-${{ steps.short.outputs.sha }}/emu.log
            irix-bench-${{ steps.short.outputs.sha }}/emu.stdout
          retention-days: 30

      - name: Stop emulator
        if: always()
        run: |
          OUT_DIR="irix-bench-${{ steps.short.outputs.sha }}"
          SOCKET="$OUT_DIR/iris.sock"
          ./target/release/iris-ci --socket "$SOCKET" quit || true
          if [ -f "$OUT_DIR/emu.pid" ]; then
            kill "$(cat "$OUT_DIR/emu.pid")" 2>/dev/null || true
          fi
